var ACTS=[
{id:"learn",stage:1,type:"learn",title:"Learn the three P's",blurb:"What each P is, in plain words."},
{id:"sort",stage:1,type:"mc",title:"Sort a text",blurb:"Read a short text and label each phrase.",opts:PPP,

 intro:"Read the text. Then choose the P for each phrase.",
 rounds:[
 {text:"Every August, the town of Millbrook holds its county fair. Families bring pies they baked at home, and the judges give a blue ribbon to the best one. Neighbors volunteer to run the food stands for free. People here say a town is only as strong as the help its people give each other.",
  qs:[{q:"\"a blue ribbon\"",a:0,why:"The ribbon is an object. Giving it out would be a practice."},
      {q:"\"Neighbors volunteer to run the food stands\"",a:1,why:"It is something people do. You could watch them do it."},
      {q:"\"a town is only as strong as the help its people give each other\"",a:2,why:"It is a belief. It explains why neighbors work for free."},
      {q:"\"pies they baked at home\"",a:0,why:"A pie is a thing people make. You can point to it."},
      {q:"\"holds its county fair every August\"",a:1,why:"A yearly event is something the town does together."}]},
 {text:"In Port Ansel, the fishing boats are painted bright blue and each one carries a family's name. Children learn to mend nets from their grandparents. Before the season opens, the whole town walks to the harbor to wish the crews well. On the first night, each crew gives part of its catch to older neighbors. People there say the sea belongs to everyone, so its gifts should be shared.",
  qs:[{q:"\"Children learn to mend nets from their grandparents\"",a:1,why:"Teaching and learning a skill is something people do."},
      {q:"\"the sea belongs to everyone, so its gifts should be shared\"",a:2,why:"It is a belief, and it explains why the crews give fish away."},
      {q:"\"fishing boats painted bright blue\"",a:0,why:"A boat is an object people make and use."},
      {q:"\"each crew gives part of its catch to older neighbors\"",a:1,why:"Giving is an action. The reason behind it is the perspective."},
      {q:"\"the whole town walks to the harbor to wish the crews well\"",a:1,why:"It is a shared action that happens every year."}]},
 {text:"At Lakeview High, every senior gets a class jacket with the graduation year on the sleeve. On the last Friday of school, the seniors walk through their old elementary school while the younger children cheer. Teachers line the hallway and shake each student's hand. Families here believe that finishing school is an achievement for the whole family, not only for the student.",
  qs:[{q:"\"Teachers line the hallway and shake each student's hand\"",a:1,why:"A handshake is an action you can watch."},
      {q:"\"a class jacket with the graduation year on the sleeve\"",a:0,why:"The jacket is an object made for this group."},
      {q:"\"finishing school is an achievement for the whole family\"",a:2,why:"It is what families believe. It explains why the whole town celebrates."},
      {q:"\"the seniors walk through their old elementary school\"",a:1,why:"The walk is a ritual: something people do, the same way each year."}]}
 ]},
{id:"fact",stage:1,type:"mc",title:"Fact or belief?",blurb:"A fact is not a perspective. Tell them apart.",opts:["Fact","Perspective"],
 hint:"Could you check it and prove it true or false? Then it is a fact. Is it what people think is right or important? Then it is a perspective.",
 intro:"A fact can be checked. A perspective is what people believe or value. Choose one for each sentence.",
 rounds:[{qs:[
  {q:"The festival began in 1952.",a:0,why:"You can check a date."},
  {q:"Sharing food shows respect for a guest.",a:1,why:"It says what an action means to people. That is a belief."},
  {q:"A meal is not complete unless everyone is at the table.",a:1,why:"It says what people think a meal should be."},
  {q:"About 3,000 people attend each year.",a:0,why:"A number can be counted and checked."},
  {q:"Winning matters less than playing fairly.",a:1,why:"It ranks two values. Nobody can prove it true or false."},
  {q:"Most families in the town eat dinner after 8 p.m.",a:0,why:"This one is tricky. It describes what people do, and a survey could check it. It is a practice, stated as a fact. It does not say why."},
  {q:"The stadium holds 12,000 people.",a:0,why:"A size can be measured."},
  {q:"Elders deserve the best seat at the table.",a:1,why:"\"Deserve\" is a value word. Words like should, must and deserve often signal a perspective."}
 ]}]},
{id:"why",stage:1,type:"mc",title:"Match the why",blurb:"Pick the belief that explains the product or practice.",
 hint:"A perspective is a belief or value. A price, a rule or the weather is a fact, not a perspective.",
 intro:"Each line is a product or a practice. Choose the perspective that best explains it.",
 rounds:[{qs:[
  {q:"In one town, shops close for two hours at midday so families can eat lunch together.",a:0,o:["Time with family matters more than extra sales.",["Shop owners there do not like to work.","That is a judgment about people, with nothing to support it."],["Lunch is the cheapest meal of the day.","A price is a fact, not a belief."]],why:"The belief explains the practice: closing costs money, and people accept that."},
  {q:"Guests are always served first, and the host eats last.",a:1,o:[["Hosts are usually not hungry.","That would be a fact about appetite, and it does not explain a custom."],"A guest's comfort comes before your own.",["There is often not enough food.","A shortage is a fact, not a value."]],why:"Hospitality is the value. Serving order is how people act it out."},
  {q:"Every baby in the village gets a handmade quilt, sewn by the neighbors.",a:2,o:[["Blankets cost a lot in stores.","A price is a fact."],["Winters there are cold.","Weather is a fact. It explains needing a blanket, not why neighbors make it."],"A child belongs to the whole community."],why:"The quilt is the product, sewing it together is the practice, and this belief is the reason for both."},
  {q:"Players shake hands with every opponent after each game.",a:0,o:["Respect for the opponent matters more than the result.",["The rule book requires it.","A rule is a fact. Ask why the rule exists and you reach the perspective."],["The players are all friends.","That may or may not be true, and it is not a value."]],why:"The handshake shows the value in action."},

 ]}]},

 hint:"Listen again. Things are products, actions are practices, and the reason is the perspective.",
 intro:"Press Play and listen. You can play it as often as you need. Then answer.",
 rounds:[
 {audio:"Every Sunday in the town of San Rivo, three generations sit down to lunch at the grandmother's house. She makes the same soup her own mother made. Nobody looks at a phone until the meal is over. In San Rivo they say the table is where a family stays a family.",
  qs:[{q:"Which is a product?",a:0,o:["The soup","Sitting down to lunch together","The table is where a family stays a family"],why:"The soup is a thing someone makes."},
      {q:"Which is a practice?",a:1,o:["The grandmother's house","Nobody looks at a phone until the meal is over","The soup"],why:"It is a rule of behavior that people follow."},
      {q:"Which is the perspective?",a:2,o:["Three generations eat lunch","She makes the same soup","The table is where a family stays a family"],why:"\"They say\" often introduces a belief."}]},
 {audio:"In Harlow Creek, the youth soccer league gives every player the same green shirt, and nobody's name is printed on the back. After each match, both teams eat orange slices together. The coaches say the shirt reminds players that the team comes before any one person.",
  qs:[{q:"Which is a product?",a:1,o:["Both teams eat together","The green shirt with no name on it","The team comes before any one person"],why:"The shirt is an object, and its design was chosen on purpose."},
      {q:"Which is a practice?",a:0,o:["Both teams eat orange slices together after each match","The green shirt","The youth soccer league"],why:"It is something people do, every time."},
      {q:"Which is the perspective?",a:2,o:["Every player gets a shirt","Nobody's name is on the back","The team comes before any one person"],why:"This belief explains why there are no names on the shirts."}]}
 ]},

{id:"picture",stage:2,type:"mc",title:"Read a picture",blurb:"What you see, and what you only think you see.",
 hint:"A picture shows things and actions. It cannot show a belief or a feeling. You have to infer those.",
 intro:"Look closely at the drawing. Some answers are close. Choose the one the picture can really support.",
 rounds:[{pic:true,
  qs:[{q:"Which is a product you can see in Street A?",a:0,o:["One long table set out in the street",["Six people eating from shared bowls","Eating is an action, so it is a practice. The bowls alone would be a product."],["A street where neighbors feel close","Feeling close cannot be seen. That is an inference."]],why:"The table is an object, and where it stands tells you something."},
      {q:"The delivery bike in Street B: which claim does it best support?",a:0,o:["At least one home in Street B has things delivered.",["People in Street B value saving time.","Possible, but it is a belief. A bike cannot show a belief on its own."],["People in Street B do not cook for themselves.","One bike cannot tell you what a whole street does in its kitchens."]],why:"Say only as much as the object shows. One bike supports one small claim."},
      {q:"A classmate writes: \"The people in Street B are lonely.\" What is the best reply?",a:1,o:[["That is true. Each person is alone at a window.","Alone is what you see. Lonely is a feeling you added."],"The picture shows people eating apart, not how they feel.",["That is false. They chose to eat in their own homes.","You cannot see a choice either. This is also a guess."]],why:"Both other replies claim to know something the drawing cannot show.",
       d:{label:"In one sentence: what is the difference between \"alone\" and \"lonely\" in a picture?",model:"Alone is something I can see and count; lonely is a feeling, and only the people themselves can tell me that."}},
      {q:"The artist gave Street A a string of party lights and put a delivery bike in Street B. What do you do with that?",a:2,o:[["Use it as proof that Street A is the happier street.","Lights are the artist's decision. They are not evidence about feelings."],["Set the drawing aside, because the artist took a side.","Every source has a point of view. You name it and still use what the source shows."],"Note it as the artist's choice, and check a second source."],why:"One picture is one person's view. Use it, name the view, and confirm it somewhere else."}],
  write:[{id:"pic-w",label:"What might each street value? What in the picture makes you think so? What would you still need to find out?",model:"Street A may value doing things together: there is one table and the bowls are shared. Street B may value privacy or quiet: the homes are separate and food is delivered. I cannot be sure from one drawing. I would need to hear from people who live there."}]}]},

{id:"chart",stage:2,type:"mc",title:"Read a chart",blurb:"What a number proves, suggests, or cannot say.",

 intro:"Read the chart and the small print under it. Then answer.",
 rounds:[
 {chart:{title:"How often do you eat dinner with your family?",note:"Survey of 200 residents of Harlow Creek, by the town library, March 2025.",rows:[["Every day",62],["A few times a week",25],["Rarely",13]]},
  lead:"For each sentence, decide: does the chart prove it, only suggest it, or have nothing to say about it?",
  opts:["Proves it","Suggests it","Cannot say"],
  qs:[{q:"Most residents of Harlow Creek eat dinner with family every day.",a:1,no:{0:"The survey asked 200 people, not the whole town.",2:"The survey is about this town, so it does point that way. It only falls short of proof."},why:"200 people are a sample. A sample can point toward the whole town. It cannot prove it."},
      {q:"Most of the people surveyed say they eat dinner with family every day.",a:0,no:{1:"No need to hold back here. 62 percent of the people asked said exactly this.",2:"Look at the top bar. This is what the chart counts."},why:"This sentence stays inside the survey: the people asked, and what they said."},
      {q:"Families there eat together because they believe it keeps a family close.",a:2,no:{0:"The chart counts how often. Nobody was asked why.",1:"It is a fair guess, but it is your guess. The chart has no reasons in it."},why:"The word \"because\" adds a perspective. This chart shows a practice only."},
      {q:"About one in eight of the people surveyed rarely eats dinner with family.",a:0,no:{1:"Do the math: 13 percent is close to one in eight. The chart states it.",2:"Look at the bottom bar and turn the percent into a fraction."},why:"13 percent is about one in eight. Same number, different words."},
      {q:"Family dinner is less common in Harlow Creek than it used to be.",a:2,no:{0:"One survey from one month cannot show change.",1:"Nothing here points to the past. You would need an older survey to compare."},why:"To show change you need two points in time. This chart has one."},
      {q:"You need the perspective behind family dinner, and you have time for one more source. Which do you choose?",a:0,o:["Recorded interviews where six residents explain their dinner habits",["A new survey of 2,000 residents that asks the same question","More people answering the same question gives you a stronger number, and still no reason."],["An essay by a visitor on why the town eats together","A visitor is guessing from outside. Start with the people who live it."]],why:"Perspectives come from people explaining themselves, even if there are only six of them.",
       d:{label:"In one sentence: why did you turn down the source with the bigger number?",model:"A bigger survey only counts the practice more exactly; I need people saying why they do it."}}]},
 {chart:{title:"Why do you come to the Saturday market?",note:"Survey of 150 shoppers at the Port Ansel market, by the Port Ansel Market Association, June 2025.",rows:[["To see neighbors",48],["For fresher food",31],["For lower prices",21]]},
  qs:[{q:"Which P does this chart come closest to?",a:2,fixp:true,no:{0:"The market is a product, but the chart does not count things.",1:"Going to the market is a practice. But look at the question that was asked: it asks why."},why:"It counts the reasons people give. Stated reasons are as close as a chart gets to a perspective."},
      {q:"The survey was taken at the market. Who is missing?",a:1,o:[["Shoppers who are under 18","Possible, but the small print does not say so. One gap is certain: look at where the survey happened."],"People who do not shop at the market",["Nobody. 150 answers are enough.","The size is fine. Who was standing there is the problem."]],why:"Everyone asked had already chosen to come. People who stay away were never heard."},
      {q:"The Market Association ran the survey. What follows from that?",a:0,o:["It gains when the market looks loved, so read with care.",["It is the official body, so the numbers are settled.","Official is not the same as neutral. Ask what the group gains."],["It has a reason to lie, so the numbers are worthless.","An interest is a reason to check. It is not proof of a lie."]],why:"Name who is speaking and what they gain. Then use the numbers with that label on them."},
      {q:"Which sentence could you safely write in a project?",a:2,o:[["Port Ansel values community more than money.","That jumps from 150 shoppers to a whole town, and from a reason to a ranking of values."],["Most shoppers go to the market to see neighbors.","48 percent is not most. Most means more than half."],"Nearly half of the shoppers asked said they come to see neighbors."],why:"It keeps the number honest and says who was asked.",
       d:{label:"In one sentence: what is wrong with the most tempting wrong answer?",model:"It sounds like a strong conclusion, but it goes far past 150 shoppers at one market on one day."}}]}
 ]},

{id:"where",stage:2,type:"mc",title:"Where would you look?",blurb:"Several sources could work. Choose the best one.",
 hint:"Ask who is speaking, how close they are to the tradition, and what they gain. Then ask what the source can actually show you.",
 intro:"Every option below could be useful. Choose the one that fits the question best.",
 rounds:[{qs:[
  {q:"You want to know how a traditional bread is made at home, step by step.",a:1,o:[["A famous chef's video with a modern version of the recipe","Clear to follow, but it shows the chef's version, not what families do."],"A plain video of a family baking it in their own kitchen",["A written recipe on a flour company's website","It lists steps, but the company chose them to sell flour, and you cannot see hands at work."],["A history article about bread in the region","Good background. It will not show you the steps."]],why:"For a practice, watch the people who actually do it, where they do it."},
  {q:"You want to know why a festival matters to the people who celebrate it.",a:3,o:[["The mayor's speech at the opening ceremony","The mayor speaks for the town from a stage. Useful, but it is the official version."],["The festival website's page called \"Our Values\"","This is how the organizers want to be seen. Use it, and say who is speaking."],["A tourist's travel blog with many photos","A visitor sees products and practices. The reasons belong to the people inside."],"Interviews with three people of different ages who take part"],why:"Ordinary participants speak for themselves, and different ages show whether everyone agrees.",
   d:{label:"In one sentence: the mayor and the website also give reasons. Why are they not your first choice?",model:"They give the official version; I want the reasons of people who take part without a stage or something to promote."}},
  {q:"You want the year a tradition was officially recognized.",a:0,o:["The website of the organization that gave the recognition",["An encyclopedia article that mentions the year","Probably right, but it is second-hand. Go to whoever made the decision."],["The town's tourism page","It may be right, but its job is to attract visitors, and it did not make the decision."],["A news article from the day it happened","A strong second choice. The organization's own record is still the first-hand one."]],why:"For an official fact, go to the body that made it official."},
  {q:"You want to know how many people take part each year.",a:2,o:[["The organizers' press release, which gives a round number","Organizers want a big number. A round number with no method is a claim."],["A news article that repeats the organizers' number","It sounds independent, but it is the same number wearing a new label."],"A city report that explains how the count was made",["Your own estimate from a photo of the crowd","A photo shows one moment in one place."]],why:"A number is only as good as the method behind it."},
  {q:"A project on a town's wedding traditions. You may keep only two of these sources. Which two give you the most?",pick:2,a:[0,1],o:["A museum page describing the traditional wedding dress","An interview where two couples explain why they kept or dropped old customs",["A second museum page, about the wedding jewelry","With the first museum page you would have two products and no reasons."],["A magazine article called \"The ten most beautiful weddings\"","That is one writer's taste. It tells you little about the tradition."]],why:"Together they cover all three: the dress is a product, and the couples describe practices and give their reasons."}
 ]}]},

{id:"search",stage:2,type:"mc",title:"Fix the search",blurb:"Every fix looks reasonable. One works best.",
 hint:"A good search names the place, the thing, and what you want to know about it. Ask what kind of page each search would bring back.",
 intro:"Each search is too weak. Choose the fix that would bring back what you asked for.",
 rounds:[{qs:[
  {q:"You want to learn about breakfast traditions in Japan. Your search: \"japan food\"",a:1,o:[["best Japanese breakfast restaurants Tokyo","This finds places to buy breakfast, not what families do at home."],"traditional Japanese breakfast what families eat at home",["Japanese breakfast recipe quick and easy","A recipe gives you a product. You asked about a tradition."]],why:"It names the place, the meal and what you want to know."},
  {q:"You want to know why families in Mexico build altars for the Day of the Dead. Your search: \"day of the dead\"",a:2,o:[["Day of the Dead history and facts","You get dates and facts. You asked for a reason, and reasons come from people."],["how to make an ofrenda step by step","This finds the practice. You still need the why."],"why families build ofrendas meaning interview"],why:"Words like why, meaning and interview pull up perspectives, and \"ofrendas\" is the word people there use."},
  {q:"You want sources in the language you are studying, but every result is in English.",a:0,o:["Search in that language, with the community's own word for the topic",["Translate your English search word for word","Closer, but a word-for-word translation often misses the name people really use."],["Add the country's name to your English search","You will get English pages about that country, written from outside."]],why:"Search engines match the language you type. Use the words that community uses."},
  {q:"You want to learn about the masks a town makes for its winter carnival. Your search, \"carnival masks\", gives you only shops.",a:1,o:[["carnival masks handmade authentic","Shops use those exact words. You will get more shops."],"carnival masks history who makes them tradition",["carnival masks pictures","You will see the product. You will not learn anything about it."]],why:"Words like history and tradition bring back pages that explain, not pages that sell."},
  {q:"You found a useful fact on Wikipedia. What next?",a:2,o:[["Cite Wikipedia, with the date you read it","Honest, but anyone can edit the page. Your reader needs the source behind it."],["Find the same fact on a second website and cite that","The second site may have copied Wikipedia. Follow the fact back to where it began."],"Open the footnote and judge the original source yourself"],why:"Wikipedia is a map. The footnote takes you to a source you can read, judge and cite.",
   d:{label:"In one sentence: why is finding the fact on a second website not enough?",model:"Two websites can repeat the same mistake if one copied the other, so I need the place where the fact first came from."}}
 ]}]},

{id:"trust",stage:2,type:"mc",title:"Which source do you trust?",blurb:"Two sources. Both have a strength and a flaw.",
 hint:"Check four things: who wrote it, when, why they wrote it, and what evidence they give. Then ask what the question needs.",
 intro:"Read both sources. Neither is perfect. The best one depends on the question.",
 rounds:[
 {topic:"A town's bread festival",src:[["Source A","A page on the city museum's website, written by the museum's historian. It lists the documents it used. It was last updated in 1996."],["Source B","A blog post from this year by a baker whose family has baked at the festival for four generations. It has no documents and many family stories."]],
  qs:[{q:"Which is better for the year the festival began?",a:0,o:AB,fix:true,no:{1:"Family stories are valuable, but memory moves dates. The historian shows documents."},why:"A founding year does not change with time, so the old date on the page does not hurt. The documents decide it."},
      {q:"Which is better for what the festival means to bakers today?",a:1,o:AB,fix:true,no:{0:"A historian writing in 1996 cannot tell you what bakers feel now."},why:"She is inside the tradition and writing now. That is a first-hand perspective."},
      {q:"The baker writes that the festival began \"around 1900\". The museum says 1923. What do you write?",a:1,o:[["The festival began in 1923, so the baker's blog cannot be trusted.","The date is likely 1923. Her memory is still evidence: it shows how old the tradition feels to her family."],"The museum dates it to 1923; one baking family remembers it as older.",["The festival began around 1900, because her family was there.","A family memory is not a record. Without a document, the museum's date is stronger."]],why:"You keep the documented date and the family's view, and you say which is which.",
       d:{label:"In one sentence: why keep the baker's version at all, if the museum is probably right?",model:"Her version is not a reliable date, but it shows a perspective: her family feels the festival has always been theirs."}}]},
 {topic:"A new stadium",src:[["Source A","A post from this week by an account with no real name: \"Everyone here hates the new stadium.\" It has 4,000 likes."],["Source B","A local newspaper article from last month. It quotes four named residents, two for and two against. The newspaper's owner also owns the company that built the stadium."]],
  qs:[{q:"Which is better for what residents think?",a:1,o:AB,fix:true,no:{0:"Likes show that a post spread. They do not show who liked it or where those people live."},why:"It names people and shows more than one view. The owner's interest is a reason to read carefully, not a reason to throw it out."},
      {q:"What do the 4,000 likes prove?",a:2,o:[["That most residents agree with the post","You do not know that the accounts belong to residents."],["That the post is exaggerated","Popular does not mean true, and it does not mean false."],"That many accounts reacted to the post"],why:"A like is a click. It tells you nothing about who clicked or why."},
      {q:"How should you use Source B, now that you know who owns the newspaper?",a:0,o:["Use the residents' quotes, and say who owns the paper.",["Leave it out, because the owner profits from the stadium.","Then you lose four named voices. Name the conflict and let your reader judge."],["Use it as it is, because it quotes both sides.","Quoting both sides is good. Your reader still deserves to know who chose the quotes."]],why:"You do not hide the conflict and you do not throw away the evidence.",
       d:{label:"In one sentence: what do you lose if you leave Source B out completely?",model:"I would lose the only named residents I have, on both sides, and be left with an anonymous post."}}]},
 {topic:"How families in a region eat",src:[["Source A","A university study from 1998. Researchers visited 300 homes across the region over one year."],["Source B","A news report from this year about an online poll run by a food delivery company. 5,000 people answered."]],
  qs:[{q:"Which is better for what families do today?",a:2,o:[["Source B, because it is recent and 5,000 is a large number","Recent, yes. But these people chose to answer an online poll from a delivery company. That group is not the region."],["Source A, because researchers went into real homes","The method is strong. But 1998 tells you about 1998."],"Neither is enough alone. Look for a recent source with nothing to sell."],why:"One is strong but old. The other is new but leans. Sometimes the right move is to keep looking.",
       d:{label:"In one sentence: which flaw worried you more, the old date or the poll's audience, and why?",model:"The poll's audience worried me more, because a study can be honestly old, but a poll that only reaches delivery customers gives a tilted picture of today."}},
      {q:"What is Source A still good for?",a:1,o:[["Describing families today, since habits change slowly","You would be guessing. That is exactly what a new source has to confirm."],"Showing how things were, so you can describe change",["Nothing. It is too old to cite.","Old is not useless. Say the year and use it for then."]],why:"An older source is evidence of change. Say the year when you use it."},
      {q:"How could the delivery company's poll lean one way without anyone lying?",a:0,o:["People who order delivery are the ones most likely to see the poll.",["Companies usually adjust their numbers before publishing.","That is an accusation without evidence. Look for a way the poll could lean honestly."],["5,000 answers are too few to describe a region.","The number is fine. Who answered is the issue."]],why:"A poll reaches some people more than others. That tilts the result, even when every answer is true."}]}
 ]},

{id:"chain",stage:3,type:"write",title:"Build the chain",blurb:"Start from one P and write the others. Then two hard choices.",
 intro:"Write first. Then press \"Show a model answer\" and compare. There is more than one right answer.",
 items:[
  {id:"ch1",label:"Perspective: \"A guest should always feel welcome.\" Write one product and one practice that could show this belief.",model:"Product: a guest room kept ready, or a special set of dishes for visitors. Practice: offering food or a drink the moment someone arrives."},
  {id:"ch2",label:"Perspective: \"Nature should be protected for the next generation.\" Write one product and one practice.",model:"Product: a community garden, or reusable market bags. Practice: a yearly river clean-up day that families do together."},
  {id:"ch3",label:"Perspective: \"Hard work should be honored.\" Write one product and one practice.",model:"Product: a medal or certificate for long service. Practice: a dinner for a worker who retires."},
  {id:"ch4",label:"Now start from a product: a kitchen table that seats twelve. Write one practice and one perspective that could go with it.",model:"Practice: the whole extended family eats together every weekend. Perspective: family is more than parents and children, and it stays close by sharing meals."},
  {id:"ch5",label:"Hard choice. A town can pay for only one: its parade, which is 300 years old, or free swimming lessons for every child, which began 10 years ago. Choose one. Then name the perspective behind your choice AND the perspective behind the other choice.",model:"I would keep the lessons. The belief behind that: a community's first duty is to its children's safety and future. The belief behind the parade: a community stays a community by keeping what earlier generations handed down. Both are real values. That is why the choice is hard, and why people in the same town can disagree."},
  {id:"ch6",label:"Two people, one family. The grandmother says: \"Sunday lunch at home is not optional.\" Her grandson says: \"I work Sundays to help pay the bills. That is how I show I care.\" Name each person's perspective. Then decide: do they disagree about the value, or about the practice?",model:"Grandmother: a family stays close by being together. Grandson: you care for your family by providing for it. They disagree about the practice. The deeper value is the same for both: family comes first. One community can hold one value and still argue about how to live it."}
 ]},
{id:"find",stage:3,type:"find",title:"Find your own",blurb:"Choose a topic, search, and record what you find.",
 intro:"Pick a community and a topic you are curious about. Do not use music, and do not use your exam project topic. Search for yourself."}
];

var STAGES=[{n:1,name:"Three P's Practice",sub:"Recognize them. Every answer is checked."},
            {n:2,name:"Find the Three P's",sub:"Get them out of sources. The choices are close, and some ask for your reason."},
            {n:3,name:"Culture Detective",sub:"On your own. You write, then compare or hand in."}];
var FIND=[["f-name","My name",0],["f-topic","My community and topic",0],
 ["f-prod","A product I found, and where I found it",1],["f-prac","A practice I found, and where I found it",1],
 ["f-pers","A perspective I found, who said it, and where I found it",1],
 ["f-link","How does the perspective explain the product or the practice?",1],
 ["f-bad","One source I did not trust, and why",1],
 ["f-dis","Something two sources, or two people, disagreed about. Which did I believe, and why?",1]];

var KEY="see-do-believe-v2";
function newSeed(){return Math.floor(Math.random()*4294967296);}
function fresh(){return {v:"home",r:{},mc:{},w:{},shown:{},seed:newSeed()};}
var S=fresh();
try{var t=JSON.parse(localStorage.getItem(KEY)||"null");if(t&&t.mc){S=t;S.r=S.r||{};S.w=S.w||{};S.shown=S.shown||{};if(typeof S.seed!=="number")S.seed=newSeed();}}catch(e){}
var canSave=true;
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));canSave=true;}catch(e){canSave=false;}
  var el=document.getElementById("saved");if(el)el.textContent=canSave?"Saved on this device":"Not saved on this device";}
function esc(t){return String(t).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
function act(id){for(var i=0;i<ACTS.length;i++)if(ACTS[i].id===id)return ACTS[i];return null;}
function otext(o){return Array.isArray(o)?o[0]:o;}
function idOf(key){return key.replace(/\./g,"-");}
function qOf(key){var k=key.split("."),A=act(k[0]);return A.rounds[+k[1]].qs[+k[2]];}
function optsOf(key){var k=key.split("."),A=act(k[0]),R=A.rounds[+k[1]],Q=R.qs[+k[2]];return Q.o||(Q.fixp?PPP:null)||R.opts||A.opts;}
function hintOf(key){var k=key.split("."),A=act(k[0]),R=A.rounds[+k[1]];return R.hint||A.hint;}
function isRight(Q,oi){return Q.pick?Q.a.indexOf(oi)>=0:oi===Q.a;}
function qready(Q,st,key){
  var has=Q.pick?((st.sel||[]).length===Q.pick):(typeof st.pick==="number");
  return has&&(!Q.d||(S.w["d-"+key]||"").trim().length>=12);
}

/* Option order: different on each device, the same every time on one device. */
function hsh(s){var h=2166136261,i;for(i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}return h>>>0;}
function order(key,n){
  var a=[],i,j,tmp,x=(hsh(key)^S.seed)>>>0;
  for(i=0;i<n;i++)a.push(i);
  for(i=n-1;i>0;i--){x=(Math.imul(x,1664525)+1013904223)>>>0;j=(x>>>12)%(i+1);tmp=a[i];a[i]=a[j];a[j]=tmp;}
  return a;
}

function progress(a){
  var total=0,done=0;
  if(a.type==="mc"){a.rounds.forEach(function(r,ri){r.qs.forEach(function(q,qi){total++;var st=S.mc[a.id+"."+ri+"."+qi];if(st&&st.ok)done++;});});}
  else if(a.type==="write"){a.items.forEach(function(it){total++;if((S.w[it.id]||"").trim())done++;});}
  else if(a.type==="find"){FIND.forEach(function(f){total++;if((S.w[f[0]]||"").trim())done++;});}
  else {total=1;done=S.shown.learned?1:0;}
  return {total:total,done:done};
}

function home(){
  var h='<div class="stack gap-lg"><p class="muted">Products are what people make. Practices are what people do. Perspectives are what people believe. Work through the three stages in order.</p>';
  STAGES.forEach(function(st){
    h+='<section class="stack"><div><div class="eyebrow">Stage '+st.n+'</div><h2>'+esc(st.name)+'</h2><p class="small muted">'+esc(st.sub)+'</p></div>';
    ACTS.filter(function(a){return a.stage===st.n;}).forEach(function(a){
      var p=progress(a),full=p.done===p.total;
      h+='<button type="button" class="card" data-go="'+a.id+'" id="go-'+a.id+'"><span><b>'+esc(a.title)+'</b><span class="small muted">'+esc(a.blurb)+'</span></span><span class="n'+(full?' done':'')+'">'+(full?'Done':p.done+' of '+p.total)+'</span></button>';
    });
    h+='</section>';
  });
  h+='<section class="box noprint"><h3>Start over</h3><p class="small muted">This erases every answer saved on this device.</p>';
  h+=S.shown.reset?'<div class="bar"><button type="button" class="btn solid" data-reset="yes">Yes, erase everything</button><button type="button" class="btn quiet" data-reset="no">Cancel</button></div>'
                  :'<div><button type="button" class="btn quiet" data-reset="ask">Erase my answers</button></div>';
  h+='</section></div>';
  return h;
}

function learn(){
  return '<div class="stack gap-lg"><h2>Learn the three P\'s</h2>'
  +'<div class="box"><h3>Product: what you can see</h3><p>Something people make or use. You can point to it.</p><p class="small muted">A homemade pie, a team shirt, a building, a law, a cookbook.</p></div>'
  +'<div class="box"><h3>Practice: what people do</h3><p>An action, and the way people do it.</p><p class="small muted">Eating Sunday lunch together, shaking hands, volunteering at a fair.</p></div>'
  +'<div class="box"><h3>Perspective: what people believe</h3><p>A belief or value. It is the reason behind the product or the practice.</p><p class="small muted">"Family comes first." "Neighbors should help each other."</p></div>'
  +'<div class="box soft"><h3>The quick test</h3><p>Can you touch it? <b>Product.</b><br>Can you watch people do it? <b>Practice.</b><br>Is it the why? <b>Perspective.</b></p></div>'
  +'<div class="box accent"><h3>They work as a chain</h3><p><b>Product:</b> a handmade quilt for every new baby.<br><b>Practice:</b> the neighbors sew it together.<br><b>Perspective:</b> a child belongs to the whole community.</p><p class="small muted">A strong project does not list the three P\'s. It shows how the belief explains the thing and the action.</p></div>'
  +'<div class="bar noprint"><button type="button" class="btn solid" data-learned="1">Got it. Next activity</button></div></div>';
}

function ctxHtml(a,r,ri){
  var h="";
  if(r.text) h+='<div class="box soft read">'+esc(r.text)+'</div>';
  if(r.audio){
    var k="au-"+a.id+ri;
    h+='<div class="box soft"><div class="bar"><button type="button" class="btn solid" data-play="'+ri+'">Play</button><button type="button" class="btn quiet" data-stop="1">Stop</button><button type="button" class="btn quiet" data-show="'+k+'">'+(S.shown[k]?'Hide the text':'Show the text')+'</button></div>'
      +'<p class="small muted" id="au-msg">Try to answer by ear first. If you hear nothing, check the volume or show the text.</p>'
      +(S.shown[k]?'<p class="read">'+esc(r.audio)+'</p>':'')+'</div>';
  }
  if(r.pic) h+=PIC+'<p class="small muted">A drawing made for this practice. Streets A and B are not real places.</p>';
  if(r.chart){
    h+='<div class="box soft"><h3>'+esc(r.chart.title)+'</h3><div class="chart">';
    r.chart.rows.forEach(function(row){h+='<div class="row"><span>'+esc(row[0])+'</span><span class="track"><span class="fill" style="display:block;width:'+row[1]+'%"></span></span><span class="v">'+row[1]+'%</span></div>';});
    h+='</div><p class="small muted">'+esc(r.chart.note)+' (made up)</p></div>';
  }
  if(r.src){
    h+='<p><b>Topic:</b> '+esc(r.topic)+'</p><div class="src">';
    r.src.forEach(function(s){h+='<div class="box soft"><h3>'+esc(s[0])+'</h3><p>'+esc(s[1])+'</p></div>';});
    h+='</div>';
  }
  if(r.lead) h+='<p><b>'+esc(r.lead)+'</b></p>';
  return h;
}

function mcHtml(a,r,ri){
  var h='<div class="stack gap-lg">',prev=-1,run=0;
  r.qs.forEach(function(Q,qi){
    var key=a.id+"."+ri+"."+qi, idk=idOf(key), st=S.mc[key]||{t:[]}, opts=optsOf(key);
    var fixed=!Q.o||!!Q.fix, two=!!(Q.d||Q.pick), sel=st.sel||[], ord=[], i, pos;
    if(fixed){for(i=0;i<opts.length;i++)ord.push(i);}
    else{
      ord=order(key,opts.length);
      if(!Q.pick){
        pos=ord.indexOf(Q.a);
        if(pos===prev&&run>=1){ord.push(ord.shift());pos=ord.indexOf(Q.a);}
        run=(pos===prev)?run+1:0; prev=pos;
      }
    }
    var cls=fixed?(opts.length===3?' three':(opts.length===2?' two':'')):'';
    h+='<div class="q"><p><b>'+(qi+1)+'.</b> '+esc(Q.q)+'</p>';
    if(Q.pick) h+='<p class="small muted">Choose '+Q.pick+'. Then press Check.</p>';
    else if(Q.d) h+='<p class="small muted">Close call. Choose, write your reason, then press Check.</p>';
    h+='<div class="opts'+cls+'">';
    ord.forEach(function(oi){
      var o=opts[oi], tried=st.t.indexOf(oi)>=0, ok=!!st.ok&&isRight(Q,oi);
      var on=!st.ok&&(Q.pick?sel.indexOf(oi)>=0:st.pick===oi);
      var attr=two?(Q.pick?'data-tg':'data-pk'):'data-mc';
      h+='<button type="button" class="opt'+(ok?' ok':'')+(tried?' no':'')+(on?' sel':'')+'" id="o-'+idk+'-'+oi+'" '+attr+'="'+key+'" data-oi="'+oi+'"'
        +(two?' aria-pressed="'+(on?'true':'false')+'"':'')+((st.ok||tried)?' disabled':'')+'><span>'+esc(otext(o))+'</span>'
        +(ok?'<span class="tag ok">Correct</span>':(tried?'<span class="tag no">Not yet</span>':(on?'<span class="tag pick">Your choice</span>':'')))+'</button>';
    });
    h+='</div>';
    if(Q.d) h+='<div class="stack"><label for="d-'+idk+'">'+esc(Q.d.label)+'</label><textarea id="d-'+idk+'" class="short" data-w="d-'+key+'" data-gate="'+key+'" rows="3">'+esc(S.w["d-"+key]||"")+'</textarea></div>';
    if(two&&!st.ok) h+='<div class="noprint"><button type="button" class="btn solid" id="chk-'+idk+'" data-chk="'+key+'"'+(qready(Q,st,key)?'':' disabled')+'>Check my answer</button></div>';
    if(st.ok){
      h+='<p class="fb" id="fb-'+idk+'" tabindex="-1" role="status"><b>Correct.</b> '+esc(Q.why)+(Q.d&&Q.d.model?' <b>One way to say it:</b> '+esc(Q.d.model):'')+'</p>';
    } else if(typeof st.bad==="number"){
      var last=opts[st.bad], msg=Array.isArray(last)?last[1]:((Q.no&&Q.no[st.bad])||hintOf(key));
      h+='<p class="fb" id="fb-'+idk+'" tabindex="-1" role="status"><b>Not yet.</b> '+esc(msg)+' Try again.</p>';
    }
    h+='</div>';
  });
  h+='</div>';
  return h;
}

function writeHtml(items){
  var h='';
  items.forEach(function(it){
    h+='<div class="stack"><label for="'+it.id+'">'+esc(it.label)+'</label><textarea id="'+it.id+'" data-w="'+it.id+'" rows="4">'+esc(S.w[it.id]||"")+'</textarea>'
      +'<div class="noprint"><button type="button" class="btn quiet" data-show="m-'+it.id+'">'+(S.shown["m-"+it.id]?'Hide the model answer':'Show a model answer')+'</button></div>'
      +(S.shown["m-"+it.id]?'<p class="fb"><b>One possible answer.</b> '+esc(it.model)+'</p>':'')+'</div>';
  });
  return h;
}

function nextBtn(a,ri,n){
  var idx=ACTS.indexOf(a), nx=ACTS[idx+1], h='<div class="bar noprint">';
  if(n>1&&ri<n-1) h+='<button type="button" class="btn solid" data-round="'+(ri+1)+'">Next round</button>';
  else if(nx) h+='<button type="button" class="btn solid" data-go="'+nx.id+'">Next: '+esc(nx.title)+'</button>';
  h+='<button type="button" class="btn quiet" data-go="home">All activities</button></div>';
  return h;
}

function activity(a){
  if(a.type==="learn") return learn();
  var st=STAGES[a.stage-1], h='<div class="stack gap-lg"><div><div class="eyebrow">Stage '+st.n+' · '+esc(st.name)+'</div><h2>'+esc(a.title)+'</h2></div><p class="muted">'+esc(a.intro)+'</p>';
  if(a.type==="mc"){
    var n=a.rounds.length, ri=Math.min(S.r[a.id]||0,n-1), r=a.rounds[ri];
    if(n>1){h+='<div class="rounds noprint" aria-label="Rounds">';for(var i=0;i<n;i++)h+='<button type="button" class="btn" id="rd-'+i+'" data-round="'+i+'" aria-pressed="'+(i===ri)+'" aria-label="Round '+(i+1)+'">'+(i+1)+'</button>';h+='</div>';}
    h+=ctxHtml(a,r,ri)+mcHtml(a,r,ri);
    if(r.write) h+=writeHtml(r.write);
    var p=progress(a);h+='<p class="small muted">'+p.done+' of '+p.total+' answered correctly in this activity.</p>'+nextBtn(a,ri,n);
  } else if(a.type==="write"){
    h+=writeHtml(a.items)+nextBtn(a,0,1);
  } else {
    h+='<div class="box soft"><h3>How to get information</h3><p><b>Products:</b> search the name of the thing plus "history" or "how it is made". Museums and official sites help.</p><p><b>Practices:</b> search "tradition", "festival" or "how people". Videos show practices best.</p><p><b>Perspectives:</b> look for people speaking: interviews, opinion pieces, "why it matters".</p><p class="small muted">Wikipedia is a map. Follow its footnotes to a source you can cite. For every source, note who wrote it, when, and what they gain.</p></div>';
    FIND.forEach(function(f){
      h+='<div class="stack"><label for="'+f[0]+'">'+esc(f[1])+'</label>'+(f[2]?'<textarea id="'+f[0]+'" data-w="'+f[0]+'" rows="4">'+esc(S.w[f[0]]||"")+'</textarea>':'<input type="text" id="'+f[0]+'" data-w="'+f[0]+'" value="'+esc(S.w[f[0]]||"")+'">')+'</div>';
    });
    h+='<div class="box noprint"><h3>Hand it in</h3><div class="bar"><button type="button" class="btn solid" data-copy="1">Copy my work</button><button type="button" class="btn quiet" data-print="1">Print</button></div>'
      +'<p class="small muted" id="copy-msg">Copy puts everything you wrote, in all three stages, on the clipboard so you can paste it into Google Classroom. If Print does nothing here, use Copy.</p>'
      +(S.shown.copyout?'<label for="copy-out">Select all of this text and copy it</label><textarea id="copy-out" readonly>'+esc(workText())+'</textarea>':'')+'</div>';
    h+='<div class="bar noprint"><button type="button" class="btn quiet" data-go="home">All activities</button></div>';
  }
  return h+'</div>';
}

function workText(){
  var L=["See, Do, Believe · my work",""];
  FIND.forEach(function(f){L.push(f[1]+":",(S.w[f[0]]||"(blank)"),"");});
  L.push("Build the chain","");
  act("chain").items.forEach(function(it){L.push(it.label,(S.w[it.id]||"(blank)"),"");});
  var pw=S.w["pic-w"];if(pw){L.push("Read a picture",pw,"");}
  L.push("My reasons on the close calls","");
  ACTS.forEach(function(a){
    if(a.type!=="mc")return;
    a.rounds.forEach(function(r,ri){r.qs.forEach(function(Q,qi){
      if(!Q.d)return;
      var key=a.id+"."+ri+"."+qi, st=S.mc[key]||{t:[]};
      L.push(a.title+": "+Q.q,"Wrong tries before the right answer: "+(st.ok?st.t.length:"not finished"),"My reason: "+(S.w["d-"+key]||"(blank)"),"");
    });});
  });
  L.push("© Assunta Scotto · See, Do, Believe");
  return L.join("\n");
}

function render(focusId){
  var a=act(S.v);
  document.getElementById("app").innerHTML=a?activity(a):home();
  document.getElementById("home-btn").hidden=!a;
  save();
  if(focusId){var el=document.getElementById(focusId);if(el){try{el.focus({preventScroll:true});}catch(e){}}}
}
function go(v){try{if(window.speechSynthesis)window.speechSynthesis.cancel();}catch(e){}S.v=act(v)?v:"home";render();try{window.scrollTo(0,0);}catch(e){}}

document.addEventListener("click",function(e){
  var b=e.target.closest?e.target.closest("button"):null; if(!b) return;
  var d=b.dataset, a=act(S.v), key, Q, st, oi, sel, i, wrong;
  if(b.id==="home-btn"){go("home");return;}
  if(d.go){go(d.go);return;}
  if(d.learned){S.shown.learned=true;go("sort");return;}
  if(d.round!==undefined&&a){S.r[a.id]=parseInt(d.round,10);go(a.id);return;}
  if(d.mc){
    key=d.mc; Q=qOf(key); oi=+d.oi; st=S.mc[key]||{t:[]};
    if(oi===Q.a){st.ok=true;} else {if(st.t.indexOf(oi)<0)st.t.push(oi);st.bad=oi;}
    S.mc[key]=st; render(st.ok?"o-"+idOf(key)+"-"+Q.a:"fb-"+idOf(key)); return;
  }
  if(d.pk){
    key=d.pk; oi=+d.oi; st=S.mc[key]||{t:[]};
    if(st.ok||st.t.indexOf(oi)>=0)return;
    st.pick=oi; S.mc[key]=st; render("o-"+idOf(key)+"-"+oi); return;
  }
  if(d.tg){
    key=d.tg; Q=qOf(key); oi=+d.oi; st=S.mc[key]||{t:[]};
    if(st.ok)return;
    sel=st.sel||[]; i=sel.indexOf(oi);
    if(i>=0)sel.splice(i,1); else {if(sel.length>=Q.pick)sel.shift();sel.push(oi);}
    st.sel=sel; S.mc[key]=st; render("o-"+idOf(key)+"-"+oi); return;
  }
  if(d.chk){
    key=d.chk; Q=qOf(key); st=S.mc[key]||{t:[]};
    if(st.ok||!qready(Q,st,key))return;
    if(Q.pick){
      wrong=(st.sel||[]).filter(function(x){return Q.a.indexOf(x)<0;});
      if(!wrong.length){st.ok=true;} else {st.bad=wrong[0];st.n=(st.n||0)+1;}
    } else if(st.pick===Q.a){st.ok=true;}
    else {if(st.t.indexOf(st.pick)<0)st.t.push(st.pick);st.bad=st.pick;st.pick=null;}
    S.mc[key]=st; render("fb-"+idOf(key)); return;
  }
  if(d.show){S.shown[d.show]=!S.shown[d.show];render();return;}
  if(d.play!==undefined&&a){
    var msg=document.getElementById("au-msg");
    try{
      if(!window.speechSynthesis||!window.SpeechSynthesisUtterance) throw new Error("none");
      window.speechSynthesis.cancel();
      var u=new SpeechSynthesisUtterance(a.rounds[+d.play].audio);u.lang="en-US";u.rate=0.9;
      window.speechSynthesis.speak(u);
    }catch(x){if(msg)msg.textContent="This device cannot read aloud here. Press \"Show the text\" and read it instead.";}
    return;
  }
  if(d.stop){try{window.speechSynthesis.cancel();}catch(x){}return;}
  if(d.reset){
    if(d.reset==="ask"){S.shown.reset=true;}
    else if(d.reset==="no"){S.shown.reset=false;}
    else{S=fresh();}
    render();return;
  }
  if(d.copy){
    var txt=workText(), m=document.getElementById("copy-msg");
    var fail=function(){S.shown.copyout=true;render("copy-out");var o=document.getElementById("copy-out");if(o){try{o.select();}catch(x){}}};
    try{navigator.clipboard.writeText(txt).then(function(){if(m)m.textContent="Copied. Paste it into Google Classroom.";},fail);}catch(x){fail();}
    return;
  }
  if(d.print){try{window.print();}catch(x){}return;}
});
document.addEventListener("input",function(e){
  var ds=e.target&&e.target.dataset?e.target.dataset:null, k=ds?ds.w:null; if(!k) return;
  S.w[k]=e.target.value; save();
  if(ds.gate){
    var c=document.getElementById("chk-"+idOf(ds.gate));
    if(c){try{c.disabled=!qready(qOf(ds.gate),S.mc[ds.gate]||{t:[]},ds.gate);}catch(x){}}
  }
});
render();
})();
</script>
</body>
</html>
